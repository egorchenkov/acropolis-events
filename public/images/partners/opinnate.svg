<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60">
  <defs>
    <style>
      .opinnate-text { font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 26px; fill: currentColor; letter-spacing: 0.5px; }
    </style>
  </defs>
  <!-- Opinnate logo mark - stylized network/firewall -->
